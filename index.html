<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Texas Cruisers Band</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;
      background: url('https://images.unsplash.com/photo-1519710164239-da123dc03ef4?auto=format&fit=crop&w=1950&q=80')
        no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.7);
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 40px;
    }

    .texas-flag {
      font-size: 52px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .texas-flag span {
      display: inline-block;
      padding: 0 6px;
    }

    .texas-flag .tx-red {
      color: #c62828;
    }

    .texas-flag .tx-white {
      color: #ffffff;
    }

    .texas-flag .tx-blue {
      color: #1565c0;
    }

    .texas-flag .tx-star {
      color: #ffd54f;
    }

    h2 {
      margin: 10px 0 5px 0;
      font-size: 24px;
    }

    .tagline {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .social-line {
      font-size: 16px;
      margin-top: 10px;
    }

    .social-line span {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <header>
      <h1 class="texas-flag">
        <span class="tx-red">THE</span>
        <span class="tx-white">TEXAS</span>
        <span class="tx-blue">CRUISERS</span>
        <span class="tx-star">★ BAND</span>
      </h1>
      <h2>Classic Rock, Country &amp; Blues</h2>
      <p class="tagline">Let’s Cruise!</p>
      <p class="social-line">
        Find us on <span>Facebook</span>, <span>Instagram</span> and <span>YouTube</span>
      </p>
    </header>
  </div>
</body>
</html>
