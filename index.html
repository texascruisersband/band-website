<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Texas Cruisers Band</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;
      background: url('https://images.unsplash.com/photo-1508614999368-9260051292e5?auto=format&fit=crop&w=1950&q=80')
        no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.55);
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* POSTER STYLE HEADER */
    .poster-title {
      font-size: 60px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .poster-title span {
      padding: 0 6px;
    }

    .tx-red { color: #c62828; }
    .tx-white { color: #ffffff; }
    .tx-blue { color: #1565c0; }
    .tx-star { color: #ffd54f; }

    .poster-sub {
      font-size: 40px;
      font-weight: bold;
      color: #d4af37; /* Gold */
      margin-bottom: 20px;
    }

    .poster-genres {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .poster-social {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .poster-tagline {
      font-size: 20px;
      font-style: italic;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="overlay">

    <!-- HEADER MATCHING YOUR POSTER -->
    <div class="poster-title">
      <span class="tx-red">TEXAS</span>
      <span class="tx-white">CRUISERS</span>
      <span class="tx-blue">BAND</span>
      <span class="tx-star">★</span>
    </div>

    <div class="poster-sub">CRUISERS BAND</div>

    <div class="poster-genres">Classic Rock, Country &amp; Blues</div>

    <div class="poster-social">Find us on Facebook, Instagram and YouTube</div>

    <div class="poster-tagline">Let's Cruise!</div>

  </div>
</body>
</html>
